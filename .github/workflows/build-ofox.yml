name: Build OrangeFox

on:
  push:
    branches:
      - bizim-recovery
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: OrangeFox manifest branch
        required: true
        default: fox_16.0
        type: string
      rom_name:
        description: Short name used in the artifact name
        required: true
        default: amon
        type: string

permissions:
  contents: write

concurrency:
  group: orangefox-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      FOX_MANIFEST_URL: https://gitlab.com/OrangeFox/Manifest.git
      FOX_MANIFEST_BRANCH: ${{ inputs.manifest_branch || 'fox_16.0' }}
      ROM_NAME: ${{ inputs.rom_name || 'amon' }}

    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -a -f || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 40G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libncurses-dev libssl-dev libxml2-utils lz4 \
            pngcrush python3 rsync schedtool squashfs-tools unzip xsltproc \
            zip zlib1g-dev

      - name: Install repo
        shell: bash
        run: |
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          sudo chmod 0755 /usr/local/bin/repo

      - name: Sync OrangeFox source
        shell: bash
        run: |
          git config --global user.name "bizim-ci"
          git config --global user.email "bizim-ci@localhost"
          git config --global color.ui false
          mkdir -p "$GITHUB_WORKSPACE/orangefox"
          cd "$GITHUB_WORKSPACE/orangefox"
          repo init --depth=1 -u "$FOX_MANIFEST_URL" -b "$FOX_MANIFEST_BRANCH"
          repo sync -c --no-clone-bundle --no-tags -j"$(nproc --all)"
          df -h /

      - name: Install this device tree
        shell: bash
        run: |
          tree="$GITHUB_WORKSPACE/orangefox/device/xiaomi/degas"
          mkdir -p "$(dirname "$tree")"
          rm -rf "$tree"
          mkdir -p "$tree"
          rsync -a --exclude .git --exclude .github --exclude rom-blobs --exclude bizim --exclude /orangefox \
            "$GITHUB_WORKSPACE/" "$tree/"

      - name: Apply Amon customization
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/bizim/apply_customization.py" "$GITHUB_WORKSPACE/orangefox/bootable/recovery"

      - name: Build OrangeFox vendor_boot
        working-directory: orangefox
        shell: bash
        run: |
          set +e +u +o pipefail
          {
            source build/envsetup.sh
            lunch ofox_degas-bp2a-eng || exit 1
            mka vendorbootimage
          } 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Generate checksums
        working-directory: orangefox/out/target/product/degas
        shell: bash
        run: sha256sum vendor_boot.img > SHA256SUMS

      - name: Publish test build
        working-directory: orangefox/out/target/product/degas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(vendor_boot.img SHA256SUMS *ramdisk*.img *ramdisk*.cpio*)
          gh release create "amon-${GITHUB_RUN_NUMBER}" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Amon Recovery test ${GITHUB_RUN_NUMBER}" --notes "Automated test build"

      - name: Publish failure log
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          df -h / > "$RUNNER_TEMP/disk.txt"
          tail -n 4000 "$GITHUB_WORKSPACE/orangefox/build.log" > "$RUNNER_TEMP/build-tail.log"
          gh release create "amon-log-${GITHUB_RUN_NUMBER}" "$RUNNER_TEMP/build-tail.log" "$RUNNER_TEMP/disk.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Amon build log ${GITHUB_RUN_NUMBER}" --notes "Automated failure log"

      - name: Upload recovery images
        uses: actions/upload-artifact@v4
        with:
          name: ofox-degas-${{ env.ROM_NAME }}-${{ github.run_number }}
          if-no-files-found: error
          path: |
            orangefox/out/target/product/degas/vendor_boot.img
            orangefox/out/target/product/degas/*ramdisk*.img
            orangefox/out/target/product/degas/*ramdisk*.cpio*
            orangefox/out/target/product/degas/SHA256SUMS
          retention-days: 14
